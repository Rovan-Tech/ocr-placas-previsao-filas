# Análise do SonarQube da Rovantech (https://sonar.rovantech.com). O endereço e o token vêm dos
# secrets da organização (SONAR_HOST_URL e SONAR_TOKEN); o job é `sonarqube` em .github/workflows/ci.yml.
sonar.projectKey=Rovan-Tech_ocr-placas-previsao-filas_1082fd43-feef-497f-b584-e2cfaa1ac8d9
sonar.projectName=ocr-placas-previsao-filas
sonar.sourceEncoding=UTF-8

sonar.sources=backend/app,backend/scripts,backend/migrations,frontend/src,scripts
sonar.tests=backend/tests,frontend/tests
sonar.exclusions=**/node_modules/**,**/.venv/**,**/dist/**,**/coverage/**,**/__pycache__/**,docs/**,docker/**

# Cobertura do projeto = a do app (backend/app e frontend/src), como no CI do repositório. Scripts
# e migrações seguem analisados (bugs, duplicação), só ficam fora da cobertura.
sonar.coverage.exclusions=backend/scripts/**,backend/migrations/**,scripts/**,frontend/src/main.tsx

sonar.python.version=3.11
# Gerados pelos jobs backend (pytest-cov) e frontend (vitest) do CI.
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
